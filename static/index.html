<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CollectMind · Collections Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#15181e; --muted:#5d6573; --line:#e3e6eb;
  --brand:#0f6b5c; --brand-soft:#e3f2ee; --warn:#b45309; --warn-soft:#fdf1e3;
  --bad:#b42318; --bad-soft:#fdeceb; --ok:#127a3e; --ok-soft:#e5f4ea; --mem:#5b3fc4; --mem-soft:#efebfb;
}
*{box-sizing:border-box} body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-size:13px;width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
header h1{font-size:17px;margin:0} header p{margin:0;color:var(--muted);font-size:12.5px}
.pills{margin-left:auto;display:flex;gap:8px}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill b{color:var(--ink)} .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--ok)}
.dot.off{background:var(--warn)}
.wrap{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 63px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}
aside h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 6px 10px}
.b{padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.b:hover{background:var(--bg)} .b.sel{background:var(--brand-soft);border-color:#bfe2d8}
.b .n{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.b .s{color:var(--muted);font-size:12.5px}
.b .m{font-size:11.5px;color:var(--mem);margin-top:3px}
.dpd{font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.hi{background:var(--bad-soft);color:var(--bad)} .md{background:var(--warn-soft);color:var(--warn)} .lo{background:var(--ok-soft);color:var(--ok)}
main{padding:22px 28px;overflow:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--brand);border-color:var(--brand)}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap} .title h2{margin:0;font-size:21px}
.title span{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{color:var(--muted);font-size:11.5px} .stat div{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;cursor:pointer;font-weight:500}
button.pri{background:var(--brand);color:#fff;border-color:var(--brand)} button:disabled{opacity:.55;cursor:wait}
.toggle{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;user-select:none}
.sw{width:32px;height:18px;border-radius:99px;background:#c9ced6;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .sw{background:var(--mem)} .toggle.on .sw::after{left:16px}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.grid.cmp{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h4{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.headline{font-size:15.5px;font-weight:600;margin:0 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.approach{background:var(--brand-soft);border-left:3px solid var(--brand);padding:10px 12px;border-radius:6px;margin:10px 0}
.approach b{display:block;font-size:11.5px;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;margin:10px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
ul{margin:4px 0 10px;padding-left:18px} li{margin:3px 0}
.avoid li::marker{color:var(--bad)}
.mem{border-color:#d9d0f5} .mem h4{color:var(--mem)}
.mi{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px} .mi:last-child{border:0}
.mi .d{font-size:11.5px;color:var(--mem);font-weight:600;margin-right:6px}
.mi .t{font-size:10.5px;color:var(--muted);border:1px solid var(--line);padding:0 5px;border-radius:4px;margin-left:4px}
.empty{color:var(--muted);font-style:italic}
.tl{margin-top:18px} .tv{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.tv .o{font-weight:600}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:90px;resize:vertical}
.toast{position:fixed;bottom:22px;right:22px;background:var(--mem);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:none;max-width:360px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.sugg span{font-size:12.5px;padding:5px 10px;border-radius:99px;background:var(--mem-soft);color:var(--mem);cursor:pointer}
.answer{white-space:pre-wrap;margin-top:14px}
.err{color:var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.label-off{background:#f1f2f4;color:var(--muted)} .label-on{background:var(--mem-soft);color:var(--mem)}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.grid,.grid.cmp,.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">CM</div>
  <div><h1>CollectMind</h1><p>Collections copilot that remembers every borrower visit</p></div>
  <div class="pills" id="pills"></div>
</header>
<div class="wrap">
  <aside><h3>My borrowers today</h3><div id="list"></div></aside>
  <main>
    <div class="tabs">
      <div class="tab on" data-t="brief">Visit brief</div>
      <div class="tab" data-t="log">Log visit</div>
      <div class="tab" data-t="ask">Ask CollectMind</div>
    </div>
    <section id="t-brief"></section>
    <section id="t-log" hidden></section>
    <section id="t-ask" hidden></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr = n => "₹" + Number(n).toLocaleString("en-IN");
let borrowers = [], cur = null, memoryOn = true, lastBrief = {};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 3800); }
const dpdCls = d => d > 60 ? "hi" : d > 30 ? "md" : "lo";

async function init() {
  const m = await api("/api/mode");
  $("#pills").innerHTML =
    `<span class="pill"><span class="dot ${m.memory==="hindsight"?"":"off"}"></span>Memory: <b>${m.memory==="hindsight"?"Hindsight":"Offline dev"}</b></span>` +
    `<span class="pill"><span class="dot ${m.llm==="groq"?"":"off"}"></span>LLM: <b>${m.llm==="groq"?"Groq":"not set"}</b></span>`;
  await loadList();
  select(borrowers[0].id);
}
async function loadList() {
  borrowers = await api("/api/borrowers");
  $("#list").innerHTML = borrowers.map(b => `
    <div class="b ${cur===b.id?"sel":""}" onclick="select('${b.id}')">
      <div class="n">${esc(b.name)} <span class="dpd ${dpdCls(b.dpd)}">${b.dpd} DPD</span></div>
      <div class="s">${esc(b.occupation)} · ${esc(b.village.split(",")[1] || b.village)}</div>
      <div class="m">${b.visit_count ? `🧠 ${b.visit_count} visits remembered` : "✨ New — no memory yet"}</div>
    </div>`).join("");
}
function select(id) { cur = id; loadList(); renderBrief(); renderLog(); renderAsk(); }

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  ["brief","log","ask"].forEach(k => $("#t-"+k).hidden = k !== t.dataset.t);
});

/* ---------- Brief tab ---------- */
function b() { return borrowers.find(x => x.id === cur); }
async function renderBrief() {
  const x = b();
  $("#t-brief").innerHTML = `
    <div class="title"><h2>${esc(x.name)}</h2><span>${x.id} · ${esc(x.occupation)} · ${esc(x.village)}</span></div>
    <div class="stats">
      <div class="stat"><small>Loan</small><div>${esc(x.loan_type)}</div></div>
      <div class="stat"><small>Outstanding</small><div>${inr(x.outstanding)}</div></div>
      <div class="stat"><small>EMI</small><div>${inr(x.emi)} <small>on ${x.emi_day}th</small></div></div>
      <div class="stat"><small>Overdue EMIs</small><div>${x.overdue_emis}</div></div>
      <div class="stat"><small>Days past due</small><div><span class="dpd ${dpdCls(x.dpd)}">${x.dpd}</span></div></div>
    </div>
    <div class="bar">
      <button class="pri" id="go" onclick="runBrief()">Prepare visit brief</button>
      <div class="toggle ${memoryOn?"on":""}" onclick="memoryOn=!memoryOn;this.classList.toggle('on');this.querySelector('span').textContent='Memory '+(memoryOn?'ON':'OFF')"><div class="sw"></div><span>Memory ${memoryOn?"ON":"OFF"}</span></div>
      <button onclick="compare()">Compare: without vs with memory</button>
    </div>
    <div id="out"></div>
    <div class="tl card"><h4>Visit history (loan record)</h4><div id="tl"></div></div>`;
  const vs = await api(`/api/borrowers/${cur}/visits`);
  $("#tl").innerHTML = vs.length ? vs.slice().reverse().map(v => `
    <div class="tv"><div>${v.date}</div><div><span class="o">${esc(v.outcome)}</span> · ${esc(v.approach)}${v.collected?` · ${inr(v.collected)}`:""}<br><span style="color:var(--muted)">${esc(v.notes)}</span></div></div>`).join("")
    : `<p class="empty">No visits yet. Log the first visit and CollectMind will start learning.</p>`;
}
function briefCard(r, label) {
  const k = r.brief;
  const tag = label ? `<span class="chip ${r.memory_on?"label-on":"label-off"}">${label}</span>` : "";
  return `<div class="card">
    <h4>Pre-visit brief ${tag}</h4>
    <p class="headline">${esc(k.headline)}</p>
    <div class="chips"><span class="chip dpd ${k.risk_level==="High"?"hi":k.risk_level==="Medium"?"md":"lo"}">Risk: ${esc(k.risk_level)}</span>
      <span class="chip">${esc(k.willful_or_distress)}</span><span class="chip">Promises: ${esc(k.promise_reliability)}</span></div>
    <div class="approach"><b>Recommended approach</b>${esc(k.recommended_approach)}</div>
    <dl class="kv"><dt>When / where</dt><dd>${esc(k.best_time_and_place)}</dd><dt>Who to meet</dt><dd>${esc(k.who_to_meet)}</dd><dt>Why this risk</dt><dd>${esc(k.risk_reason)}</dd></dl>
    <b>Say</b><ul>${(k.talking_points||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
    <b>Avoid</b><ul class="avoid">${(k.avoid||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
    ${r.source==="fallback"?`<p class="empty">AI model unavailable — showing a basic brief.</p>`:""}
  </div>`;
}
function memCard(r) {
  const items = r.recalled.map(m => `<div class="mi"><span class="d">${esc(m.date||"")}</span>${esc(m.text)}<span class="t">${esc(m.type)}</span></div>`).join("");
  const peers = r.peer_lessons.map(m => `<div class="mi"><span class="d">${esc(m.date||"")}</span>${esc(m.text)}</div>`).join("");
  const ev = (r.brief.memory_evidence||[]).map(e=>`<li>${esc(e)}</li>`).join("");
  return `<div class="card mem">
    <h4>What CollectMind remembers <span>${r.recalled.length} recalled</span></h4>
    ${items || `<p class="empty">${r.memory_on ? "Nothing yet — this is a new borrower." : "Memory is OFF."}</p>`}
    ${ev ? `<h4 style="margin-top:14px">Why this advice</h4><ul>${ev}</ul>` : ""}
    ${peers ? `<h4 style="margin-top:14px">Lessons from similar borrowers</h4>${peers}` : ""}
  </div>`;
}
async function runBrief() {
  const btn = $("#go"); btn.disabled = true; btn.innerHTML = `<span class="spin"></span>Recalling memories…`;
  try {
    const r = await api(`/api/borrowers/${cur}/brief?memory=${memoryOn}`);
    lastBrief[cur] = r.brief.recommended_approach;
    $("#out").innerHTML = `<div class="grid">${briefCard(r)}${memCard(r)}</div>`;
    renderLog();
  } catch (e) { $("#out").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  btn.disabled = false; btn.textContent = "Prepare visit brief";
}
async function compare() {
  $("#out").innerHTML = `<p class="empty"><span class="spin" style="border-color:#0002;border-top-color:var(--mem)"></span>Generating both briefs…</p>`;
  try {
    const [off, on] = await Promise.all([api(`/api/borrowers/${cur}/brief?memory=false`), api(`/api/borrowers/${cur}/brief?memory=true`)]);
    lastBrief[cur] = on.brief.recommended_approach;
    $("#out").innerHTML = `<div class="grid cmp">${briefCard(off,"Without memory")}${briefCard(on,"With Hindsight memory")}</div>`;
    renderLog();
  } catch (e) { $("#out").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

/* ---------- Log tab ---------- */
const APPROACHES = ["Soft reminder at home","Firm reminder at home","Home visit Sunday morning","Visit with JLG group leader","SHG meeting collection","Spoke to spouse","Visit at shop","WhatsApp reminder","Phone call","Invited to branch meeting","Offered partial payment plan"];
const OUTCOMES = ["Paid in full","Partial payment","Promise to pay","Refused","Not reachable"];
function renderLog() {
  const x = b(), rec = lastBrief[cur] || "";
  $("#t-log").innerHTML = `<div class="card" style="max-width:760px">
    <h4>Log a visit for ${esc(x.name)}</h4>
    <form id="vf">
      <div class="row"><div><label>Visit date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div>
        <div><label>Officer</label><input name="officer" value="${esc(x.officer)}" required></div></div>
      <div class="row"><div><label>Who did you meet?</label><input name="met" placeholder="e.g. Anjali and her husband" required></div>
        <div><label>Approach used</label><select name="approach">${APPROACHES.map(a=>`<option>${a}</option>`).join("")}</select></div></div>
      <div class="row"><div><label>Outcome</label><select name="outcome">${OUTCOMES.map(a=>`<option>${a}</option>`).join("")}</select></div>
        <div><label>Amount collected (₹)</label><input name="collected" type="number" min="0" value="0"></div></div>
      <div class="row"><div><label>Promise date (if any)</label><input name="promise_date" type="date"></div>
        <div><label>&nbsp;</label>${rec?`<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="followed" style="width:auto" checked> I followed CollectMind's advice</label>`:`<span class="empty">Tip: prepare a brief first so CollectMind can learn if its advice worked.</span>`}</div></div>
      ${rec?`<div class="approach"><b>CollectMind recommended</b>${esc(rec)}</div>`:""}
      <label>What happened? (reasons, family, income, anything useful next time)</label>
      <textarea name="notes" required placeholder="e.g. Husband sells vegetables at Narsampet rythu bazaar, cash comes on Sundays. She asked us not to visit when her mother-in-law is home…"></textarea>
      <div style="margin-top:14px"><button class="pri" id="save">Save visit & teach CollectMind</button></div>
    </form></div>`;
  $("#vf").onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const body = { borrower_id: cur, date: f.date, officer: f.officer, met: f.met, approach: f.approach, outcome: f.outcome,
      collected: Number(f.collected||0), promise_date: f.promise_date||"", notes: f.notes,
      recommended_approach: rec, followed_recommendation: !!f.followed };
    const s = $("#save"); s.disabled = true; s.innerHTML = `<span class="spin"></span>Retaining to memory…`;
    try {
      await api("/api/visits", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
      toast(`🧠 CollectMind learned from this visit. Next brief for ${x.name.split(" ")[0]} will use it.`);
      delete lastBrief[cur]; await loadList(); renderBrief(); renderLog();
      document.querySelector('.tab[data-t="brief"]').click();
    } catch (err) { toast("Could not save: " + err.message); }
    s.disabled = false; s.textContent = "Save visit & teach CollectMind";
  };
}

/* ---------- Ask tab ---------- */
function renderAsk() {
  const x = b();
  const qs = [`Is ${x.name.split(" ")[0]} likely to keep the next promise?`, `What is ${x.name.split(" ")[0]}'s income cycle?`,
    "Across all borrowers, which collection approaches worked best and which failed?", "Which borrowers are genuine distress cases that need restructuring?",
    "What have we learned about visiting agri borrowers?"];
  $("#t-ask").innerHTML = `<div class="card" style="max-width:820px">
    <h4>Ask CollectMind (Hindsight reflect)</h4>
    <div class="row" style="display:grid;grid-template-columns:1fr 220px;gap:10px">
      <input id="q" placeholder="Ask anything about your borrowers…">
      <select id="scope"><option value="">Whole portfolio</option><option value="${x.id}">Only ${esc(x.name)}</option></select></div>
    <div class="sugg">${qs.map(q=>`<span data-scope="${q.includes(x.name.split(' ')[0])?x.id:''}">${esc(q)}</span>`).join("")}</div>
    <button class="pri" id="askb" onclick="ask()">Ask</button>
    <div class="answer" id="ans"></div></div>`;
  $("#q").onkeydown = e => { if (e.key === "Enter") ask(); };
  document.querySelectorAll(".sugg span").forEach(sp => sp.onclick = () => { $("#q").value = sp.textContent; $("#scope").value = sp.dataset.scope; ask(); });
}
async function ask() {
  const q = $("#q").value.trim(); if (!q) return;
  const btn = $("#askb"); btn.disabled = true; btn.innerHTML = `<span class="spin"></span>Reflecting…`;
  try { const r = await api("/api/ask", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ question: q, borrower_id: $("#scope").value || null }) });
    $("#ans").textContent = r.answer;
  } catch (e) { $("#ans").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  btn.disabled = false; btn.textContent = "Ask";
}
init();
</script>
</body>
</html>
